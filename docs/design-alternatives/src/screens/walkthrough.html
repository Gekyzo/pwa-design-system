<!-- {"name":"Walkthrough","behind":"compra-empty","corner":false} -->
<div class="onboarding" role="dialog" aria-modal="true" aria-label="Introducción">
  <div class="onboarding-top">
    <button class="button quiet" type="button">Saltar</button>
  </div>
  <div class="onboarding-page">
    <div class="onboarding-logo logo-box" aria-hidden="true"><svg class="icon"><use href="#basket"/></svg></div>
    <div class="onboarding-art">
      <svg viewBox="0 0 240 160" aria-hidden="true">
        <rect class="art-card art-accent" x="60" y="20" width="120" height="120" rx="10"/>
        <rect class="art-accent" x="72" y="40" width="12" height="12" rx="3"/>
        <path class="art-accent" d="M75 46l2.5 2.5 4-5"/>
        <rect class="art-accent" x="72" y="70" width="12" height="12" rx="3"/>
        <rect class="art-accent" x="72" y="100" width="12" height="12" rx="3"/>
        <path d="M92 46h56M92 76h48M92 106h52"/>
      </svg>
    </div>
    <div>
      <h2 class="onboarding-title">Tu próxima compra, casi hecha</h2>
      <p class="onboarding-text">En <span class="onboarding-key">Compra</span> llevas la compra de hoy.
Lo que no compras hoy se queda en la lista para la próxima.</p>
    </div>
    <label class="switch onboarding-switch away"><span>Añadir la receta de ejemplo</span><input class="switch-input" type="checkbox" role="switch" checked></label>
  </div>
  <div class="onboarding-dots" role="img" aria-label="Página 1 de 6"><span class="onboarding-dot on"></span><span class="onboarding-dot"></span><span class="onboarding-dot"></span><span class="onboarding-dot"></span><span class="onboarding-dot"></span><span class="onboarding-dot"></span></div>
  <button class="button primary wide" type="button">Siguiente</button>
</div>
