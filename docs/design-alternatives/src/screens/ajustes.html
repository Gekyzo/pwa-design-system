<!-- {"name":"Ajustes","title":"Ajustes","subtitle":"Bodega","section":"settings"} -->
<section class="settings">
  <h2 class="list-group-head">Copia de seguridad</h2>
  <div class="list-group card">
    <button class="settings-row" type="button"><span class="settings-row-label">Exportar</span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="settings-row" type="button"><span class="settings-row-label">Importar</span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="settings-row danger" type="button"><span class="settings-row-label">Borrar todos los datos</span></button>
  </div>
  <h2 class="list-group-head">Preferencias</h2>
  <div class="list-group card">
    <div class="settings-row"><span class="settings-row-label">Idioma</span><span class="settings-row-value">Español</span><span class="chevron" aria-hidden="true">›</span><select class="select" aria-label="Idioma"><option>Español</option></select></div>
    <div class="settings-row"><span class="settings-row-label">Mano</span><span class="settings-row-value">Derecha</span><span class="chevron" aria-hidden="true">›</span><select class="select" aria-label="Mano"><option>Derecha</option></select></div>
    <div class="settings-row"><span class="settings-row-label">Tema</span><span class="settings-row-value">Automático</span><span class="chevron" aria-hidden="true">›</span><select class="select" aria-label="Tema"><option>Automático</option></select></div>
    <div class="settings-row"><span class="settings-row-label">Densidad</span><span class="settings-row-value">Normal</span><span class="chevron" aria-hidden="true">›</span><select class="select" aria-label="Densidad"><option>Normal</option></select></div>
  </div>
  <h2 class="list-group-head">Al terminar la compra</h2>
  <p class="hint settings-hint">Selecciona qué ocurre con los artículos no comprados: descartarlos o aplazarlos a la próxima compra.</p>
  <div class="list-group card">
    <div class="segmented" role="group" aria-label="Al terminar la compra"><button class="segment" type="button" aria-pressed="false">Descartar</button><button class="segment" type="button" aria-pressed="true">Aplazar</button></div>
  </div>
  <h2 class="list-group-head">Secciones</h2>
  <div class="list-group card">
    <button class="settings-row" type="button"><span class="settings-row-label">Secciones de la tienda</span><span class="settings-row-value">6</span><span class="chevron" aria-hidden="true">›</span></button>
  </div>
  <h2 class="list-group-head">Ayuda</h2>
  <div class="list-group card">
    <button class="settings-row" type="button"><span class="settings-row-label">Ver la introducción</span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="settings-row danger" type="button"><span class="settings-row-label">Borrar la receta de ejemplo</span></button>
  </div>
  <footer class="about">
    <p class="about-line"><span>Versión 1.2.5</span><span class="version-status" data-status="current" role="status"><svg data-for="current" class="icon small" aria-hidden="true"><use href="#check-circle"/></svg><span class="version-status-text">Al día</span></span></p>
  </footer>
</section>
