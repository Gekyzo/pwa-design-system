<!-- {"name":"Sections sheet","behind":"compra"} -->
<div class="sheet-layer">
  <div class="sheet-veil"></div>
  <div class="sheet sections-sheet" role="dialog" aria-label="Secciones">
    <div class="sheet-grab"></div>
    <header class="sheet-head"><h2 class="sheet-title main">Secciones</h2><button class="button primary" type="button">Listo</button></header>
    <div class="sheet-body">
      <ul class="list-group plain" aria-label="Secciones">
        <li><button class="list-row" type="button" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#cart"/></svg><span class="list-row-text">Compra</span><span class="list-row-meta">5 artículos</span></button></li>
        <li><button class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="#book"/></svg><span class="list-row-text">Recetas</span><span class="list-row-meta">3</span></button></li>
        <li><button class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="#menu"/></svg><span class="list-row-text">Menú</span><span class="list-row-meta">5 comidas</span></button></li>
        <li><button class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="#settings"/></svg><span class="list-row-text">Ajustes</span></button></li>
      </ul>
      <h2 class="sheet-title part">Compra</h2>
      <ul class="list-group plain" aria-label="Opciones de Compra">
        <li><button class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="#filter"/></svg><span class="list-row-text">Agrupar y ordenar</span><span class="list-row-meta">Secciones · Nombre</span></button></li>
        <li><button class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="#check-circle"/></svg><span class="list-row-text">Terminar compra</span><span class="list-row-meta">3 de 8</span></button></li>
      </ul>
    </div>
  </div>
</div>
