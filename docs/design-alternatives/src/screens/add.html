<!-- {"name":"Add sheet","behind":"compra"} -->
<div class="sheet-layer">
  <div class="sheet-veil"></div>
  <form class="sheet" autocomplete="off">
    <div class="sheet-grab"></div>
    <header class="sheet-head"><h2 class="sheet-title main">Añadir artículo</h2><button class="button primary" type="button">Listo</button></header>
    <div class="sheet-body">
      <ul class="list-group plain" aria-label="Artículos que ya existen">
        <li><button class="list-row" type="button"><span class="list-row-text">Queso curado</span><span class="list-row-meta">comprado antes · añadir</span></button></li>
        <li><button class="list-row" type="button"><span class="list-row-text">Quinoa</span><span class="list-row-meta">comprado antes · añadir</span></button></li>
        <li><button class="list-row accent" type="button">+ Crear «Qu»</button></li>
      </ul>
      <div class="input-row pinned">
        <input class="input strong" type="text" value="Qu" aria-label="Añadir artículo a la lista">
        <button class="button primary" type="submit">Añadir</button>
      </div>
    </div>
  </form>
</div>
