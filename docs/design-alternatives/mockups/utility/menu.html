<!doctype html>
<html lang="es" data-hand="right">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú — Taller</title>
<style>
@layer tokens, base, components, layouts, screens;

@layer tokens {
  :root {
    /* `light-dark()` takes its value from `color-scheme`: the phone, or Theme in Settings. */
    color-scheme: light dark;
    --bg: light-dark(#f6f7f5, #111613); /* page */
    --surface: light-dark(#ffffff, #1d2621); /* rows, header, sheets */
    --surface-2: light-dark(#eef2ef, #26302a); /* a field or a row set on --surface */
    --text: light-dark(#17201b, #e8ede9);
    --muted: light-dark(#667069, #98a39c); /* second text, idle icons */
    --line: light-dark(#dfe4e0, #2c3530); /* borders and separators */
    --accent: light-dark(#1f7a4d, #5fc491); /* main action, selection */
    --accent-text: light-dark(#ffffff, #0c1a12); /* text on --accent */
    --accent-soft: light-dark(#e2f2ea, #1d3327); /* selected chip, swipe action */
    --danger: light-dark(#b3261e, #f2b8b5);
    --warning: light-dark(#9a5b00, #f2b65c);
    --toast-bg: light-dark(#17201b, #e8ede9);
    --toast-text: light-dark(#ffffff, #17201b);
    --knob: #ffffff; /* the knob of a switch, in both themes */
    --scrim: rgb(0 0 0 / 0.45); /* veil behind a sheet */

    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; /* keys of the walkthrough */
    --text-xs: 0.75rem; /* labels, badges, captions */
    --text-s: 0.875rem; /* second text, chips */
    --text-m: 1rem; /* body */
    --text-l: 1.375rem; /* screen title */
    --text-xl: 2rem; /* the + of the add button */
    --weight-normal: 400;
    --weight-medium: 600; /* titles, selected labels */
    --weight-strong: 700;

    --space-half: 2px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 32px;

    --radius-s: 4px;
    --radius-m: 12px; /* buttons, inputs */
    --radius-l: 20px; /* groups, banner, add button */
    --radius-xl: 28px; /* top of a sheet */
    --radius-pill: 999px;
    --radius-round: 50%;

    --tap: 48px; /* least size of a tap target */
    --tap-l: 56px; /* rows, add button */
    --icon: 24px;
    --icon-s: 20px;
    --arrow: 6px; /* the arrow of a select */
    --nav-height: 64px;
    --dock-height: 56px; /* the bar of the main action above the bottom bar */
    /* The adaptive layout (LAY-1): the rail from 600px, the two panes from 840px. */
    --rail-width: 80px;
    --side-sheet: 400px; /* a sheet with a head from 840px */
    --content-max: 640px;
    --pane-list: 360px;
    --art-width: 240px; /* the drawings of the walkthrough */
    --logo: 96px; /* the app icon at the top of the walkthrough */

    --shadow-s: 0 1px 3px rgb(0 0 0 / 0.3);
    --shadow-l: 0 8px 24px rgb(0 0 0 / 0.14);

    --motion-fast: 150ms;
    --motion: 250ms;
    --motion-slow: 1.2s;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1); /* the curve of every move */
  }

  @media (prefers-reduced-motion: reduce) {
    :root {
      --motion-fast: 0ms;
      --motion: 0ms;
      --motion-slow: 0ms;
    }
  }

  /* The compact density: shorter bars and add button. --tap does not change. */
  :root[data-density="compact"] {
    --tap-l: 48px;
    --nav-height: 56px;
    --dock-height: 48px;
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }
}

@layer base {
  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  button {
    min-height: var(--tap);
    border: 0;
    border-radius: var(--radius-m);
    background: none;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  [hidden] {
    display: none !important;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* @component main
     @summary The scrolling area of a section, between the header and the bottom bar.
     @state enter-next      The content comes in from the right, after a change of section.
     @state enter-previous  The content comes in from the left.
     @example <p>The main element holds the sections; it has no example of its own.</p> */
  main {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    /* A horizontal slide changes the section, so the browser must not take it. */
    touch-action: pan-y;
    overflow-x: hidden;
    padding-bottom: calc(var(--tap-l) + var(--space-4) * 2);
  }

  /* The dock stands above the bottom bar below 600px, so the content clears it as well. */
  body:has(.dock:not([hidden])) main {
    padding-bottom: calc(var(--tap-l) + var(--space-4) * 2 + var(--dock-height));
  }

  @media (min-width: 600px) {
    body:has(.dock:not([hidden])) main {
      padding-bottom: calc(var(--tap-l) + var(--space-4) * 2);
    }
  }

  /* The content of a new section comes in from its side. `main` stays in its place, so its scroll
     and the bottom padding do not move. */
  main.enter-next > *,
  main.enter-previous > * {
    animation: enter var(--motion) var(--ease);
  }

  main.enter-next {
    --enter-from: 48px;
  }

  main.enter-previous {
    --enter-from: -48px;
  }

  @keyframes enter {
    from {
      opacity: 0;
      transform: translateX(var(--enter-from));
    }
  }
}

@layer components {
  /* @component icon
     @summary A line icon of icons.svg. It takes the colour of the text around it.
     @variant small  The size --icon-s, for an icon beside a label.
     @example <svg class="icon" aria-hidden="true"><use href="icons.svg#note"/></svg>
     @example <svg class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg> */
  .icon {
    flex: none;
    width: var(--icon);
    height: var(--icon);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon.small {
    width: var(--icon-s);
    height: var(--icon-s);
  }

  /* @component button
     @summary Tap target for one action. Min height --tap. The base look has no fill.
     @variant primary  Main action of a view or a sheet. One for each view.
     @variant outline  Second action beside a primary, or an action of a row.
     @variant quiet    Muted text, for an action that steps back, such as Saltar.
     @variant accent   Accent text and no fill, for an action that is not the main one.
     @variant danger   Removes data. Combine with outline.
     @variant strong   Strong text, for the action of a toast.
     @variant icon     Square, icon or one sign only. Needs an aria-label.
     @variant toggle   An icon button that is on with aria-pressed="true": the icon takes the accent over a soft accent shape.
     @variant wide     Takes the full width of its box.
     @example <button class="button primary" type="button">Add</button>
     @example <button class="button outline" type="button">Clear menu</button>
     @example <button class="button outline danger" type="button">Delete</button>
     @example <button class="button outline quiet" type="button">Skip</button>
     @example <button class="button accent" type="button">Update</button>
     @example <button class="button primary icon" type="button" aria-label="Send"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"/></svg></button>
     @example <button class="button icon toggle" type="button" aria-pressed="true" aria-label="Always"><svg class="icon" aria-hidden="true"><use href="icons.svg#refresh"/></svg></button>
     @example <button class="button icon" type="button" aria-label="More">⋯</button>
     @example <button class="button primary wide" type="button">Save the note</button> */
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: var(--tap);
    padding: 0 var(--space-4);
    border: 1px solid transparent;
    border-radius: var(--radius-m);
    background: none;
    color: inherit;
    text-align: center;
    text-decoration: none;
  }

  .button.primary {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: var(--weight-strong);
  }

  .button.outline {
    border-color: var(--line);
  }

  .button.quiet {
    color: var(--muted);
  }

  .button.accent {
    color: var(--accent);
    font-weight: var(--weight-strong);
  }

  .button.danger {
    color: var(--danger);
  }

  .button.strong {
    font-weight: var(--weight-strong);
  }

  .button.icon {
    flex: none;
    width: var(--tap);
    height: var(--tap);
    padding: 0;
    font-size: var(--text-l);
  }

  .button.icon:where(:not(.primary, .accent)) {
    color: var(--muted);
  }

  .button.toggle {
    color: var(--muted);
  }

  .button.toggle[aria-pressed="true"] {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .button.wide {
    width: 100%;
  }

  /* @component chip
     @summary A choice among several, such as a tag or a filter. Selected with aria-pressed="true".
     @variant surface  On a --bg background: the chip takes --surface.
     @part count  A number after the label, in muted text.
     @example <button class="chip" type="button">Home</button>
     @example <button class="chip" type="button" aria-pressed="true">Work</button>
     @example <div class="cluster" style="background: var(--bg)"><button class="chip surface" type="button" aria-pressed="true"><span>All</span><span class="count">4</span></button><button class="chip surface" type="button"><span>Home</span><span class="count">1</span></button></div> */
  .chip {
    min-height: var(--tap);
    padding: 0 var(--space-4);
    border-radius: var(--radius-pill);
    background: var(--bg);
    font-size: var(--text-s);
  }

  .chip.surface {
    flex: none;
    background: var(--surface);
  }

  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: var(--weight-strong);
  }

  .chip .count {
    margin-left: var(--space-2);
    color: var(--muted);
    font-weight: var(--weight-normal);
  }

  /* @component pill
     @summary A small tag beside a name. It is below the tap size: a button pill is a second way to an action.
     @variant ghost  A dashed outline, for a state that is off.
     @example <span class="pill">Done today</span>
     @example <button class="pill ghost" type="button">+ Later</button> */
  .pill {
    flex: none;
    min-height: 0;
    padding: var(--space-1) var(--space-3);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: var(--text-xs);
    white-space: nowrap;
  }

  .pill:is(button) {
    min-height: calc(var(--tap) - var(--space-3));
  }

  .pill.ghost {
    border: 1px dashed var(--muted);
    background: none;
    color: var(--muted);
  }

  /* @component segmented
     @summary One choice of two or three, side by side, drawn as a switch: a track, and a knob that slides to the chosen segment. The chosen segment has aria-pressed="true".
     @part segment  One choice.
     @example <div class="segmented"><button class="segment" type="button" aria-pressed="true">For today</button><button class="segment" type="button" aria-pressed="false">For later</button></div> */
  .segmented {
    --segment-count: 2;
    --segment-index: 0;
    position: relative;
    isolation: isolate;
    display: flex;
    margin: var(--space-3) 0 var(--space-1);
    padding: var(--space-1);
    border-radius: var(--radius-pill);
    background: var(--surface-2);
  }

  .segmented:has(> .segment:nth-child(3)) {
    --segment-count: 3;
  }

  .segmented:has(> .segment:nth-child(2)[aria-pressed="true"]) {
    --segment-index: 1;
  }

  .segmented:has(> .segment:nth-child(3)[aria-pressed="true"]) {
    --segment-index: 2;
  }

  /* The knob: one segment wide, moved by whole segments. It sits under the labels. */
  .segmented::before {
    content: '';
    position: absolute;
    top: var(--space-1);
    bottom: var(--space-1);
    left: var(--space-1);
    z-index: -1;
    width: calc((100% - 2 * var(--space-1)) / var(--segment-count));
    border-radius: var(--radius-pill);
    background: var(--accent);
    box-shadow: var(--shadow-s);
    transform: translateX(calc(var(--segment-index) * 100%));
    transition: transform var(--motion);
  }

  .segmented:not(:has(> .segment[aria-pressed="true"]))::before {
    opacity: 0;
  }

  .segmented .segment {
    flex: 1;
    min-height: var(--tap);
    border-radius: var(--radius-pill);
    font-size: var(--text-s);
    transition: color var(--motion);
  }

  .segmented .segment[aria-pressed="true"] {
    color: var(--accent-text);
    font-weight: var(--weight-strong);
  }

  /* @component switch
     @summary A setting that is on or off: its name, then the switch.
     @part switch-input  The checkbox with role="switch".
     @example <label class="switch"><span>Later</span><input class="switch-input" type="checkbox" role="switch" checked></label> */
  .switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: var(--tap-l);
    padding: 0 var(--space-4);
  }

  .switch + .switch {
    border-top: 1px solid var(--line);
  }

  .switch-input {
    appearance: none;
    position: relative;
    flex: none;
    width: 44px;
    height: 26px;
    margin: 0;
    border-radius: var(--radius-l);
    background: var(--muted);
    cursor: pointer;
    transition: background var(--motion);
  }

  .switch-input::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--space-1);
    margin: auto 0;
    width: 20px;
    height: 20px;
    border-radius: var(--radius-round);
    background: var(--knob);
    box-shadow: var(--shadow-s);
    transition: transform var(--motion);
  }

  .switch-input:checked {
    background: var(--accent);
  }

  .switch-input:checked::after {
    transform: translateX(16px);
  }

  /* @component input
     @summary A one-line text box. Height --tap, on --bg.
     @variant raised  On a --bg page: the box takes --surface.
     @variant strong  The main box of a sheet, with an accent border.
     @example <input class="input" type="text" placeholder="New tag">
     @example <input class="input raised" type="search" placeholder="Search">
     @example <input class="input strong" type="text" placeholder="Añadir artículo a la lista">
     @state invalid  aria-invalid="true": the border takes --danger, also on focus.
     @part input-help  A line of help or error below the box.
     @variant danger  On input-help: the error text in --danger.
     @example <div><input class="input" type="text" value="Notes" aria-invalid="true"><p class="input-help danger">Enter a name</p></div> */
  .input {
    width: 100%;
    min-width: 0;
    height: var(--tap);
    padding: 0 var(--space-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg);
  }

  .input.raised {
    background: var(--surface);
  }

  .input:focus-visible {
    outline: none;
    border-color: var(--accent);
  }

  .input::-webkit-search-cancel-button {
    appearance: none;
  }

  .input[aria-invalid="true"] {
    border-color: var(--danger);
  }

  .input-help {
    margin: var(--space-1) 0 0;
    color: var(--muted);
    font-size: var(--text-s);
  }

  .input-help.danger {
    color: var(--danger);
  }

  .input.strong {
    border: 1px solid var(--accent);
  }

  /* The border grows by 1px on each side, so the padding shrinks by 1px and the text stays still. */
  .input.strong:focus-visible {
    border-width: 2px;
    padding-inline: calc(var(--space-3) - 1px);
  }

  /* An invalid box keeps the danger border on focus, strong and in a field. */
  .input[aria-invalid="true"]:focus-visible {
    border-color: var(--danger);
  }

  .input.strong[aria-invalid="true"] {
    border-color: var(--danger);
  }

  .input.strong[aria-invalid="true"]:focus-visible {
    border-color: var(--danger);
  }

  .field-input[aria-invalid="true"]:focus {
    border-color: var(--danger);
  }

  /* @component field
     @summary An input with its name as a label: inside the box while it is empty, on its top border
       once it has a value or the focus. The placeholder only marks the empty box.
     @part field-input  The input, with the classes input field-input and a placeholder.
     @part field-label  The name, after the input.
     @example <label class="field"><input class="input field-input" type="text" placeholder="Text" value="Call Ana"><span class="field-label">Name</span></label>
     @example <label class="field"><input class="input field-input" type="text" placeholder="Cantidad"><span class="field-label">Amount</span></label> */
  .field {
    position: relative;
    display: block;
    margin-top: var(--space-4);
  }

  .field-input {
    border: 2px solid var(--line);
  }

  .field-input:focus {
    border-color: var(--accent);
  }

  .field-input::placeholder {
    color: transparent;
  }

  .field-label {
    position: absolute;
    top: 50%;
    left: var(--space-3);
    padding: 0 var(--space-1);
    border-radius: var(--radius-s);
    background: var(--bg);
    color: var(--muted);
    line-height: 1;
    pointer-events: none;
    transform: translateY(-50%);
    transition: top var(--motion-fast) var(--ease), font-size var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }

  .field-input:focus + .field-label,
  .field-input:not(:placeholder-shown) + .field-label {
    top: 0;
    background: linear-gradient(var(--surface) 50%, var(--bg) 50%);
    font-size: var(--text-xs);
  }

  .field-input:focus + .field-label {
    color: var(--accent);
  }

  /* @component select
     @summary A choice from a list, full width, with its own arrow.
     @example <select class="select" aria-label="Language"><option>English</option></select> */
  .select {
    appearance: none;
    display: block;
    width: 100%;
    min-height: var(--tap-l);
    padding: 0 var(--tap) 0 var(--space-4);
    border: 0;
    background:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%) right calc(var(--space-4) + var(--space-half) + var(--arrow)) center / var(--arrow) var(--arrow) no-repeat,
      linear-gradient(135deg, var(--muted) 50%, transparent 50%) right calc(var(--space-4) + var(--space-half)) center / var(--arrow) var(--arrow) no-repeat;
    color: inherit;
    font: inherit;
  }

  /* List */

  /* @component app-header
     @summary The top of each section: the ring, the title and its summary, and up to three tool buttons.
     @part app-header-text      The title and the summary, which take the free width.
     @part app-header-title     The name of the section.
     @part app-header-subtitle  The summary of the section.
     @example <header class="app-header" style="border: 0"><div class="ring" style="--pct: 33%"><span class="ring-text">2/6</span></div><div class="app-header-text"><h1 class="app-header-title">Today</h1><p class="app-header-subtitle">4 notes left</p></div><button class="button icon" type="button" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="icons.svg#help"/></svg></button></header> */
  .app-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) var(--space-3);
    position: relative;
    border-bottom: 1px solid var(--line);
    touch-action: pan-y;
  }

  .app-header-text {
    flex: 1;
    min-width: 0;
  }

  /* The tools stand closer to each other than to the title, so that three leave room for it. */
  .app-header .button.icon:not([hidden]) ~ .button.icon:not([hidden]) {
    margin-left: calc(var(--space-2) * -1);
  }

  .app-header .button.icon[aria-expanded="true"] {
    color: var(--accent);
  }

  .app-header-title {
    margin: 0;
    font-size: var(--text-l);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-header-subtitle {
    margin: var(--space-half) 0 0;
    color: var(--muted);
    font-size: var(--text-s);
  }

  /* @component ring
     @summary The progress of a section, as a ring around a short text. --pct sets the arc.
     @part ring-text  The text in the middle.
     @example <div class="ring" style="--pct: 66%"><span class="ring-text">4/6</span></div> */
  .ring {
    --pct: 0%;
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: var(--radius-round);
    background: conic-gradient(var(--accent) var(--pct), var(--line) 0);
  }

  .ring-text {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-round);
    background: var(--bg);
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
    font-weight: var(--weight-strong);
  }

  /* @component nav-bar
     @summary The bottom bar below 600px, a rail from 600px at the start side, or at the end side with data-hand="right" on the root (the app pads its body on the rail side): one item for each section that is on.
     @part nav-item  A section: its icon and its name. The current one has aria-current="page".
     @example <nav class="nav-bar" style="width: 100%"><button class="nav-item" type="button" aria-current="page"><svg class="icon" aria-hidden="true"><use href="icons.svg#note"/></svg><span>Notes</span></button><button class="nav-item" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg><span>Later</span><em class="badge">2</em></button></nav> */
  .nav-bar {
    display: flex;
    flex: none;
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  .nav-item {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-half);
    height: var(--nav-height);
    border-radius: 0;
    color: var(--muted);
    font-size: var(--text-xs);
  }

  /* The current section is a pill behind its icon; its label stays plain. */
  .nav-item[aria-current="page"] {
    color: var(--text);
    font-weight: var(--weight-medium);
  }

  .nav-item[aria-current="page"] .icon {
    box-sizing: content-box;
    padding: var(--space-1) var(--space-5);
    border-radius: var(--radius-pill);
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* From 600px the bar is a rail at the start side, so a tablet or a phone on its side keeps its
     height for the content (LAY-2). */
  @media (min-width: 600px) {
    .nav-bar {
      position: fixed;
      inset-block: 0;
      inset-inline-start: 0;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      width: calc(var(--rail-width) + env(safe-area-inset-left));
      padding-bottom: 0;
      padding-inline-start: env(safe-area-inset-left);
      border-top: 0;
      border-inline-end: 1px solid var(--line);
    }

    .nav-item {
      flex: none;
    }
  }

  /* The right hand puts the rail at the end side, where the thumb is. The app pads its body on the
     rail side. */
  @media (min-width: 600px) {
    :root[data-hand="right"] .nav-bar {
      inset-inline-start: auto;
      right: 0;
      width: calc(var(--rail-width) + env(safe-area-inset-right));
      padding-inline-start: 0;
      padding-right: env(safe-area-inset-right);
      border-inline-end: 0;
      border-left: 1px solid var(--line);
    }
  }

  /* @component badge
     @summary A count on a nav item. It is hidden while it is empty.
     @example <span style="position: relative; display: inline-block; width: 48px; height: 32px"><em class="badge">2</em></span> */
  .badge {
    position: absolute;
    top: var(--space-2);
    left: calc(50% + var(--space-2));
    padding: 0 var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--accent-text);
    font-size: var(--text-xs);
    font-style: normal;
    font-weight: var(--weight-strong);
  }

  .badge:empty {
    display: none;
  }

  /* @component sheet
     @summary A panel that comes up from the bottom over a veil; from 840px a sheet with a head is a side sheet. The layer is hidden to close it.
     @part sheet-layer  The fixed layer that holds the veil and the sheet.
     @part sheet-veil   The dark veil; a tap on it closes the sheet.
     @part sheet-grab   The handle at the top. A drag on it closes the sheet.
     @part sheet-head   The bar under the handle: a title and a Done or close button.
     @part sheet-body   The part that scrolls, between the head and the foot.
     @part sheet-foot   The bar that stays at the bottom: the actions of the sheet.
     @part sheet-saved  A short note in the foot, such as Saved.
     @state on          On sheet-saved: the note shows.
     @part sheet-title  A title of the sheet or of one of its parts.
     @variant main      On sheet-title: the title of the head, one line.
     @variant part      On sheet-title: a title below a line that separates it from the part above.
     @part entry        A choice of the sheet: a name, with its effect below it.
     @part entry-note   The effect of an entry.
     @example <div class="sheet" style="border-radius: var(--radius-xl)"><div class="sheet-grab"></div><h2 class="sheet-title">Group by</h2><button class="entry" type="button"><span>Finish</span><small class="entry-note">Done notes leave the list</small></button><h2 class="sheet-title part">Tags</h2></div>
     @example <div class="sheet" style="border-radius: var(--radius-xl); position: static"><div class="sheet-grab"></div><header class="sheet-head"><h2 class="sheet-title main">Note</h2><button class="button" type="button">Done</button></header><div class="sheet-body">Text of the note.</div><footer class="sheet-foot"><button class="button outline danger" type="button">Delete</button><span class="sheet-saved on">Saved</span></footer></div> */
  .sheet-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: display var(--motion) allow-discrete;
  }

  /* A sheet that leaves stays on the screen for the transition, and takes no tap. */
  .sheet-layer[hidden] {
    pointer-events: none;
  }

  .sheet-veil {
    position: absolute;
    inset: 0;
    background: var(--scrim);
    transition: opacity var(--motion) var(--ease);
  }

  .sheet-layer[hidden] .sheet-veil {
    opacity: 0;
  }

  .sheet-layer[hidden] .sheet {
    transform: translateY(100%);
  }

  @starting-style {
    .sheet-veil {
      opacity: 0;
    }

    .sheet {
      transform: translateY(100%);
    }
  }

  .sheet {
    position: relative;
    max-height: 85%;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    background: var(--surface);
    transition: transform var(--motion) var(--ease);
  }

  /* A sheet without a head scrolls as a whole, as before. */
  .sheet:not(:has(.sheet-head)) {
    overflow-y: auto;
    padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom));
  }

  /* A sheet with a head keeps its padding in the parts, and only the body scrolls. */
  .sheet:has(.sheet-head) {
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }

  /* The handle. A sheet without a head keeps the small bar of 0.2.1. */
  .sheet-grab {
    width: 40px;
    height: 4px;
    margin: 0 auto var(--space-3);
    border-radius: var(--radius-s);
    background: var(--line);
    touch-action: none;
  }

  /* With a head, the handle is a tap tall and draws its bar inside. */
  .sheet:has(.sheet-head) .sheet-grab {
    position: relative;
    flex: none;
    width: auto;
    height: var(--tap);
    margin: 0;
    background: none;
  }

  .sheet:has(.sheet-head) .sheet-grab::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 4px;
    border-radius: var(--radius-s);
    background: var(--muted);
    transform: translate(-50%, -50%);
  }

  .sheet-head {
    display: flex;
    flex: none;
    align-items: center;
    gap: var(--space-3);
    padding: 0 var(--space-4) var(--space-2);
    touch-action: none;
  }

  .sheet-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 var(--space-4);
  }

  /* A headed sheet without a foot ends at the screen edge, so its body clears the bottom inset. */
  .sheet:has(.sheet-head):not(:has(.sheet-foot)) .sheet-body {
    padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
  }

  .sheet-foot {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }

  .sheet-saved {
    color: var(--muted);
    font-size: var(--text-s);
    opacity: 0;
    transition: opacity var(--motion);
  }

  .sheet-saved.on {
    opacity: 1;
  }

  [data-hand="left"] .sheet-head,
  [data-hand="left"] .sheet-foot {
    flex-direction: row-reverse;
  }

  .sheet-title {
    margin: var(--space-2) 0 0;
    color: var(--muted);
    font-size: var(--text-s);
    font-weight: var(--weight-strong);
  }

  /* The title of the head: it takes the free width and keeps to one line. */
  .sheet-title.main {
    flex: 1;
    min-width: 0;
    margin: 0;
    overflow: hidden;
    color: var(--text);
    font-size: var(--text-l);
    font-weight: var(--weight-strong);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* A title below a line that separates its part from the part above. */
  .sheet-title.part {
    margin-top: var(--space-5);
    padding-top: var(--space-4);
    border-top: 1px solid var(--line);
  }

  /* From 840px a sheet with a head is a side sheet, full height, at the start side next to the rail
     (the end side with data-hand="right" on the root). A sheet without a head keeps the bottom sheet. */
  @media (min-width: 840px) {
    .sheet-layer:has(.sheet-head) {
      flex-direction: row;
      align-items: stretch;
      justify-content: flex-start;
      padding-inline-start: calc(var(--rail-width) + env(safe-area-inset-left));
    }

    .sheet-layer:has(.sheet-head) .sheet {
      width: var(--side-sheet);
      height: 100%;
      max-height: 100%;
      border-start-start-radius: 0;
      border-start-end-radius: var(--radius-xl);
      border-end-start-radius: 0;
      border-end-end-radius: var(--radius-xl);
    }

    .sheet-layer:has(.sheet-head)[hidden] .sheet {
      transform: translateX(-100%);
    }

    @starting-style {
      .sheet-layer:has(.sheet-head) .sheet {
        transform: translateX(-100%);
      }
    }

    .sheet:has(.sheet-head) .sheet-grab {
      display: none;
    }

    /* With no grab above it, the head clears the top inset. */
    .sheet-layer:has(.sheet-head) .sheet-head {
      padding-top: calc(var(--space-3) + env(safe-area-inset-top));
    }

    :root[data-hand="right"] .sheet-layer:has(.sheet-head) {
      justify-content: flex-end;
      padding-inline-start: 0;
      padding-inline-end: calc(var(--rail-width) + env(safe-area-inset-right));
    }

    :root[data-hand="right"] .sheet-layer:has(.sheet-head) .sheet {
      border-start-start-radius: var(--radius-xl);
      border-start-end-radius: 0;
      border-end-start-radius: var(--radius-xl);
      border-end-end-radius: 0;
    }

    :root[data-hand="right"] .sheet-layer:has(.sheet-head)[hidden] .sheet {
      transform: translateX(100%);
    }

    @starting-style {
      :root[data-hand="right"] .sheet-layer:has(.sheet-head) .sheet {
        transform: translateX(100%);
      }
    }
  }

  .entry {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: var(--space-half);
    width: 100%;
    min-height: 56px;
    margin-top: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--bg);
    text-align: left;
  }

  .entry-note {
    color: var(--muted);
    font-size: var(--text-xs);
  }

  /* @component toast
     @summary A short message at the bottom, with an optional action. With a sheet open it goes to the top.
     @part toast-text  The message.
     @example <div class="toast" role="status" style="position: static"><span class="toast-text">Note deleted</span><button class="button strong" type="button">Undo</button></div> */
  .toast {
    position: fixed;
    /* Above the add button, in reach of the thumb. */
    bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + var(--tap-l) + var(--space-6));
    left: calc(var(--space-3) + env(safe-area-inset-left));
    right: calc(var(--space-3) + env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 48px;
    padding: var(--space-1) var(--space-1) var(--space-1) var(--space-4);
    border-radius: var(--radius-m);
    background: var(--toast-bg);
    color: var(--toast-text);
    box-shadow: var(--shadow-l);
    transition: opacity var(--motion) var(--ease), transform var(--motion) var(--ease), display var(--motion) allow-discrete;
  }

  /* The toast leaves to this state, and enters from the same one. */
  .toast[hidden] {
    opacity: 0;
    transform: translateY(12px);
  }

  @starting-style {
    .toast {
      opacity: 0;
      transform: translateY(12px);
    }
  }

  /* Below 600px a visible dock stands under the toast, so the toast clears it. */
  body:has(.dock:not([hidden])) .toast {
    bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + var(--dock-height) + var(--tap-l) + var(--space-6));
  }

  .toast-text {
    flex: 1;
  }

  /* No bar at the bottom from 600px: the toast goes down, and clears the rail. */
  @media (min-width: 600px) {
    .toast {
      bottom: calc(env(safe-area-inset-bottom) + var(--tap-l) + var(--space-6));
      left: calc(var(--rail-width) + env(safe-area-inset-left) + var(--space-3));
    }

    body:has(.dock:not([hidden])) .toast {
      bottom: calc(env(safe-area-inset-bottom) + var(--tap-l) + var(--space-6));
    }

    :root[data-hand="right"] .toast {
      left: calc(var(--space-3) + env(safe-area-inset-left));
      right: calc(var(--rail-width) + env(safe-area-inset-right) + var(--space-3));
    }
  }

  /* Last, so it wins over the dock lift above. An open sheet has the bottom of the screen, so the toast goes to the top. */
  body:has(.sheet-layer:not([hidden])) .toast {
    top: calc(var(--space-2) + env(safe-area-inset-top));
    bottom: auto;
  }

  /* @component banner
     @summary A message in the flow of a list, with its action below it.
     @part banner-text  The text below the title.
     @example <section class="banner"><strong>Done?</strong><p class="banner-text">All done.</p><button class="button primary wide" type="button">Finish</button></section> */
  .banner {
    margin: var(--space-4) var(--space-3);
    padding: var(--space-4) var(--space-4);
    border-radius: var(--radius-l);
    background: var(--accent-soft);
  }

  .banner-text {
    margin: var(--space-1) 0 var(--space-3);
    font-size: var(--text-s);
  }

  /* @component empty-state
     @summary The text of a list or a part with nothing in it. Holds a button, except inline (STATE-1). A second action is a button outline below the primary.
     @variant inline  In a sheet: aligned with the content, with less space.
     @variant low     At the bottom of its area, in reach of the thumb. The app gives the list area a height, as the percent needs one.
     @part empty-state-title  The short title above the text.
     @example <div class="empty-state"><p>The list is empty.</p><button class="button primary" type="button">Bring from Later</button></div>
     @example <div class="empty-state low" style="height: 240px"><h2 class="empty-state-title">Nothing here</h2><p>Add the first note.</p><button class="button primary" type="button">Add a note</button></div>
     @example <p class="empty-state inline">No note matches.</p> */
  .empty-state {
    margin: calc(var(--space-6) * 2) var(--space-6);
    color: var(--muted);
    text-align: center;
  }

  .empty-state .button {
    margin-top: var(--space-2);
  }

  /* The empty state is on --bg, with art behind it, and its text is muted: a second action is a
     --surface box with the text colour, like the content of the list. */
  .empty-state .button.outline {
    background: var(--surface);
    color: var(--text);
  }

  .empty-state.inline {
    margin: var(--space-3) 0;
    text-align: left;
  }

  .empty-state.low {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-2);
    min-height: 50%;
    margin: 0 var(--space-5) var(--space-6);
  }

  .empty-state.low .button {
    width: 100%;
    min-height: var(--tap-l);
    margin-top: 0;
  }

  .empty-state-title {
    margin: 0;
    color: var(--text);
    font-size: var(--text-l);
    font-weight: var(--weight-strong);
  }

  /* @component item-list
     @summary The list of a section: item rows, section heads and group heads.
     @example <ul class="item-list"><li class="item-row"><div class="item-row-body"><button class="item-row-name" type="button"><span>Call Ana</span></button></div></li></ul> */
  .item-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  /* A row closes before it leaves the list, and a group head before the list becomes flat. `collapse` in motion.js sets the height. */
  .item-list > .leaving {
    overflow: hidden;
    min-height: 0;
    opacity: 0;
    transition: height var(--motion) var(--ease), opacity var(--motion) var(--ease);
  }

  /* @component item-row
     @summary One entry of a list, as a row. Its body slides over its actions.
     @part item-row-swipe         The box that clips the sliding body.
     @part item-row-body          The row itself: check, name, then buttons.
     @part item-row-check         The round checkbox of an entry that can be done.
     @part item-row-name          The name button, with its quantity and its meta line.
     @part item-row-qty           The quantity after the name.
     @part item-row-label         The text of the name. It keeps two lines, then ends with an ellipsis.
     @part item-row-meta          A muted line below the name, such as its tags.
     @part item-row-end           The fixed slot at the end, two buttons wide. It holds up to two button icon and
                                  mirrors as a whole for the left hand.
     @part item-row-actions       The swipe actions behind the right end. Hidden while the row is closed, so a
                                  fractional pixel ratio shows no edge of them. The drag code adds open on settle.
     @part item-row-backdrop      The action under a slide to the right.
     @state done      A ticked entry: its name is struck out.
     @state flash     A row that has just come back: its body flashes.
     @state gone      A row that the motion code hides at once.
     @state lifted    A row that the drag code lifts.
     @state leaving   A row that closes before it leaves.
     @state open      On item-row-swipe: the actions show.
     @state armed     On item-row-swipe: a slide far enough to run its action.
     @state dragging  On item-row-body: the body follows the finger, with no transition.
     @state tick      On item-row-body: the whole body is the tick target. The check is a mark only.
     @example <ul class="item-list" style="width: 100%"><li class="item-row"><div class="item-row-swipe"><div class="item-row-body"><input class="item-row-check" type="checkbox" aria-label="Call Ana"><button class="item-row-name" type="button"><span class="item-row-label">Ideas <span class="item-row-qty">1 h</span></span><small class="item-row-meta">Work</small></button><button class="button icon toggle" type="button" aria-pressed="false" aria-label="Repeat"><svg class="icon" aria-hidden="true"><use href="icons.svg#refresh"/></svg></button></div></div></li><li class="item-row done"><div class="item-row-body"><input class="item-row-check" type="checkbox" checked aria-label="Read book"><button class="item-row-name" type="button"><span>Read book</span></button><button class="pill ghost" type="button">+ Later</button></div></li></ul>
     @example <ul class="item-list" style="width: 100%"><li class="item-row"><div class="item-row-body tick"><input class="item-row-check" type="checkbox" aria-label="Call Ana"><button class="item-row-name" type="button"><span class="item-row-label">Call Ana about the long list of notes for the next meeting at the office</span></button><div class="item-row-end"><button class="button icon" type="button" aria-label="Edit"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg></button><button class="button icon" type="button" aria-label="Delete"><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg></button></div></div></li></ul>
     @example <ul class="item-list" style="width: 100%"><li class="item-row"><div class="item-row-swipe open"><div class="item-row-actions"><button class="swipe-action" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg><span class="swipe-action-label">Move</span></button><button class="swipe-action danger" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg><span class="swipe-action-label">Delete</span></button></div><div class="item-row-body" style="transform: translateX(-144px)"><button class="item-row-name" type="button"><span>Call Ana</span></button></div></div></li></ul> */
  .item-row {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    /* The rows of a scope open a gap for a lifted row. `placeLifted` in drag.js sets the transform. */
    transition: transform var(--motion-fast) var(--ease);
  }

  .item-row.lifted {
    position: relative;
    z-index: 2;
    box-shadow: var(--shadow-l);
    transition: none;
  }

  .item-row.flash .item-row-body {
    animation: flash var(--motion-slow) var(--ease);
  }

  .item-row.gone {
    display: none;
  }

  @keyframes flash {
    from {
      background: var(--accent-soft);
    }
  }

  .item-row-swipe {
    position: relative;
    overflow: hidden;
  }

  .item-row-actions {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    display: flex;
  }

  .item-row-swipe:not(.open) .item-row-actions {
    visibility: hidden;
  }

  /* The slide to the right shows its action below the row. The actions cover it. */
  .item-row-backdrop {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding-left: var(--space-5);
    background: var(--accent-soft);
    color: var(--accent);
    transition: background var(--motion-fast), color var(--motion-fast);
  }

  .item-row-swipe.armed .item-row-backdrop {
    background: var(--accent);
    color: var(--accent-text);
  }

  .item-row-body {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--tap-l);
    padding: 0 var(--space-1) 0 var(--space-2);
    background: var(--surface);
  }

  .item-row-swipe .item-row-body {
    padding-right: var(--space-3);
    touch-action: pan-y;
    user-select: none;
    transition: transform var(--motion-fast) var(--ease);
  }

  .item-row-swipe .item-row-body.dragging {
    transition: none;
  }

  .item-row-check {
    flex: none;
    display: grid;
    place-items: center;
    width: var(--icon);
    height: var(--icon);
    margin: var(--space-3) var(--space-1) var(--space-3) var(--space-2);
    border: 2px solid var(--muted);
    border-radius: var(--radius-round);
    background: none;
    appearance: none;
    cursor: pointer;
  }

  .item-row-check:checked {
    border-color: var(--accent);
    background: var(--accent);
  }

  /* The tick: two sides of a small box, turned. */
  .item-row-check:checked::after {
    content: "";
    width: 10px;
    height: 5px;
    margin-top: calc(var(--space-half) * -1);
    border: solid var(--accent-text);
    border-width: 0 0 2px 2px;
    transform: rotate(-45deg);
  }

  /* The slot at the end: as wide as two buttons, so the text ends at the same place on every row. */
  .item-row-end {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: calc(var(--tap) * 2);
  }

  /* With tick, the body takes the tap and the check only shows the state. */
  .item-row-body.tick {
    cursor: pointer;
  }

  .item-row-body.tick .item-row-check {
    pointer-events: none;
  }

  .item-row-name {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    min-width: 0;
    min-height: var(--tap-l);
    padding: 0 var(--space-1);
    border-radius: 0;
    overflow-wrap: anywhere;
    text-align: left;
  }

  /* A row with no checkbox: its name keeps the place of one. */
  .item-row-body > .item-row-name:first-child {

  }

  @media (min-width: 600px) {
    body:has(.dock:not([hidden])) .app-header .button.icon[aria-controls="search"] {
      display: inline-flex;
    }
  }

  /* A short window, such as a phone on its side, gives more of its height to the list. */
  @media (max-height: 480px) {
    .app-header {
      padding-top: calc(var(--space-2) + env(safe-area-inset-top));
      padding-bottom: var(--space-2);
    }
  }

  /* @extends sheet */
  /* From 600px a sheet keeps the width of the column and stands below it, so a tablet does not show
     it as wide as the screen. The veil still covers the rail. From 840px a sheet with a head is the
     side sheet of the design system, at the side of the hand. */
  @media (min-width: 600px) {
    .sheet-layer {
      padding-right: calc(var(--rail-width) + env(safe-area-inset-right));
    }

    [data-hand="left"] .sheet-layer {
      padding-right: 0;
      padding-left: calc(var(--rail-width) + env(safe-area-inset-left));
    }

    .sheet {
      width: 100%;
      max-width: var(--content-max);
      margin-inline: auto;
    }
  }

  @media (min-width: 840px) {
    .sheet-layer:has(.sheet-head) .sheet {
      margin-inline: 0;
    }
  }

  /* @extends dock
     @state searching  The search is open: the field and Cancelar take the dock, and the list ends
                       at the dock, so the nearest match is next to the field. */
  /* The search button stays at the end of the dock, also with no shop list. */
  .dock {
    justify-content: flex-end;
  }

  /* @extends dock */
  /* Left hand: the shared mirror would read the arrows backwards, so ‹ chip › keep their order and
     only the search button moves to the start side. The search mode mirrors as the shared dock. */
  [data-hand="left"] .dock {
    flex-direction: row;
    justify-content: flex-start;
  }

  [data-hand="left"] .dock > .button.icon[aria-controls="dock-field"] {
    order: -1;
  }

  [data-hand="left"] .dock.searching {
    flex-direction: row-reverse;
  }

  .dock-field > .icon {
    flex: none;
    margin-inline-start: var(--space-3);
    color: var(--muted);
  }

  .dock-field > .icon + .dock-input {
    padding-inline-start: var(--space-2);
  }

  .dock .chip .chevron {
    margin-inline-start: var(--space-2);
  }

  body:has(.dock.searching:not([hidden])) main {
    display: flex;
    flex-direction: column;
  }

  body:has(.dock.searching:not([hidden])) .item-list {
    margin-top: auto;
  }

  @media (min-width: 600px) {
    body:has(.dock.searching:not([hidden])) main {
      display: block;
    }

    body:has(.dock.searching:not([hidden])) .item-list {
      margin-top: 0;
    }
  }

  /* A field beside a button, as the link of a recipe beside its open button, takes the room that is left. */
  .input-row > .field {
    flex: 1;
  }

  .input-row > .button.icon {
    align-self: flex-end;
  }

  /* Guardado holds a check icon before its text. */
  .sheet-saved {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
  }

  /* @extends item-row
     @variant recipe              A recipe: its name and its meta line, then its send button.
     @state bought    A ticked item of Actual. */

  /* From 840px the recipes stand in two columns, so more of them fit on the screen of a tablet. An
     unfolded phone keeps one column. The gap shows the page between the columns. */
  @media (min-width: 840px) {
    .item-list:has(> .item-row.recipe) {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--space-2);
    }
  }

  .item-row.bought .item-row-name {
    color: var(--muted);
    text-decoration: line-through;
  }

  /* Densidad Compacta (NAV-20): the token set of the design system makes a row --tap-l (48px) high;
     the check takes less room around it. */
  :root[data-density="compact"] .item-row-check {
    margin-block: var(--space-2);
  }

  /* @extends group-head
     @part group-head-button  The full-width button that closes and opens the group, with aria-expanded.
     @part group-head-end     The count and the chevron, at the end of the button. */

  .group-head:has(> .group-head-button) {
    padding: 0;
  }

  .group-head-button {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    min-height: var(--tap);
    padding: 0 var(--space-4);
    border-radius: 0;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }

  /* A recipe head slides to the right as a row does (GROUP-21): the button fills the sliding body. */
  .group-head:has(> .item-row-swipe) {
    display: block;
    padding: 0;
  }

  .group-head .item-row-swipe .item-row-body {
    min-height: var(--tap);
    padding: 0;
  }

  /* A search shows each group open and disables its head (GROUP-16); the head keeps its colour. */
  .group-head-button:disabled {
    opacity: 1;
  }

  .group-head-end {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

}

@layer screens {
  /* @component shop-lists
     @scope list
     @summary The shop lists of Actual, below the header.
     @example <div class="cluster scroll shop-lists"><button class="chip surface" type="button" aria-pressed="true"><span>Todas</span><span class="count">4</span></button></div> */
  .shop-lists {
    margin: 0;
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--line);
  }

  /* Below 600px the dock holds the shop list of Compra and the search. */
  body:has(.dock:not([hidden])) .shop-lists,
  body:has(.dock:not([hidden])) .search {
    display: none;
  }

  @media (min-width: 600px) {
    body:has(.dock:not([hidden])) .shop-lists {
      display: flex;
    }

    body:has(.dock:not([hidden])) .search {
      display: block;
    }
  }

  /* @component trip-open
     @scope list
     @summary A line of the trip sheet above Terminar compra: the counts, and what happens to the items not bought.
     @example <p class="hint trip-open">Los 2 artículos que no has comprado se descartan. Puedes cambiarlo en Ajustes.</p> */
  .hint.trip-open {
    padding: var(--space-1) 0 var(--space-3);
  }

  /* The Ajustes button ends the sentence of the hint. */
  .hint.trip-open .button::after {
    content: ".";
  }

  /* @component search
     @scope list
     @summary The search box of Actual and Recetas, below the header.
     @example <div class="search"><input class="input raised" type="search" placeholder="Buscar"></div> */
  .search {
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--line);
  }

  /* @component product-form
     @scope recipes
     @summary The row that adds a product to a recipe, in the recipe sheet.
     @part product-name  Its input, which takes the focus after an add.
     @example <form class="input-row product-form"><input class="input product-name" type="text" placeholder="Añadir producto"><button class="button primary" type="submit">Añadir</button></form> */
  .product-form {
    padding: var(--space-3) 0 var(--space-2);
  }

  /* @component hint
     @scope list
     @summary A line of help below a list.
     @example <p class="hint">Un artículo con ↻ activo vuelve aquí al comprarlo.</p> */
  .hint {
    margin: 0;
    padding: var(--space-3) var(--space-4);
    color: var(--muted);
    font-size: var(--text-s);
  }

  /* @component product-add
     @scope recipes
     @summary The add row of a recipe with the suggestions below it.
     @example <div class="product-add" style="width: 100%"><ul class="list-group plain"><li><button class="list-row" type="button">Huevos</button></li></ul></div> */
  .product-add > .list-group {
    padding-bottom: var(--space-2);
  }

  /* @component version-status
     @scope settings
     @summary The state of the installed version: a sign, and a text for the outdated state only.
     @part version-status-text  The text of the state. With a sign it stays for screen readers only.
     @example <span class="version-status" data-status="current" role="status"><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><span class="version-status-text">Al día</span></span> */
  .version-status {
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }

  .version-status [data-for] {
    display: none;
  }

  .version-status[data-status='checking'] [data-for='checking'],
  .version-status[data-status='current'] [data-for='current'],
  .version-status[data-status='outdated'] [data-for='outdated'],
  .version-status[data-status='unknown'] [data-for='unknown'] {
    display: block;
  }

  .version-status[data-status='checking'] .icon {
    animation: spin var(--motion-slow) linear infinite;
  }

  .version-status[data-status='current'] {
    color: var(--accent);
  }

  .version-status[data-status='outdated'] {
    flex-basis: 100%;
    justify-content: center;
    color: var(--warning);
  }

  .version-status[data-status='unknown'] {
    color: var(--danger);
  }

  .version-status:not([data-status='outdated']) .version-status-text {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @keyframes spin {
    to {
      transform: rotate(1turn);
    }
  }

  /* @component day
     @scope menu
     @summary One day of the menu: its name, then its two meals side by side.
     @part day-title  The name of the day.
     @part day-long   The long name of the day.
     @part day-short  The short name of the day: it shows instead of the long one in the compact density below 600px.
     @part meals      The two meals.
     @example <ul class="item-list" style="width: 100%"><li class="day"><h3 class="day-title"><span class="day-long">Lunes</span><span class="day-short">lun</span></h3><div class="meals"><button class="meal" type="button"><small class="meal-label">Comida</small><span class="meal-name">Tortilla</span></button><button class="meal free" type="button"><small class="meal-label">Cena</small><span class="meal-name">Elegir receta</span></button></div></li></ul> */
  .day {
    padding: var(--space-2) var(--space-3) var(--space-3);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .day-title {
    margin: 0 0 var(--space-2);
    color: var(--muted);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .day:not(:has(.meal.free)) .day-title {
    color: var(--accent);
  }

  .meals {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-2);
  }

  /* From 600px the name of the day stands at the start of its row, so the week fits on the screen
     of a tablet or an unfolded phone. A subgrid gives each name the width of the longest one, in
     any language. */
  @media (min-width: 600px) {
    .item-list:has(> .day) {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
    }

    .day {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: subgrid;
      align-items: center;
      column-gap: var(--space-3);
      padding-block: var(--space-2);
    }

    .day-title {
      margin: 0;
    }
  }

  /* Densidad Compacta (NAV-20), below 600px: the day head stays above its meals, with the short name
     of the day, and the name of a meal takes two lines. From 600px the long name stands beside the
     meals again. */
  .day-short {
    display: none;
  }

  :root[data-density="compact"] .day {
    padding-block: var(--space-1) var(--space-2);
  }

  :root[data-density="compact"] .day-long {
    display: none;
  }

  :root[data-density="compact"] .day-short {
    display: inline;
    text-transform: uppercase;
  }

  :root[data-density="compact"] .day-title {
    margin-bottom: var(--space-1);
    text-transform: none;
  }

  :root[data-density="compact"] .meal {
    min-height: var(--tap);
    padding-block: var(--space-1);
  }

  :root[data-density="compact"] .meal-name {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  @media (min-width: 600px) {
    :root[data-density="compact"] .day {
      padding-block: var(--space-1);
    }

    :root[data-density="compact"] .day-long {
      display: inline;
    }

    :root[data-density="compact"] .day-short {
      display: none;
    }

    :root[data-density="compact"] .day-title {
      margin-bottom: 0;
      text-transform: uppercase;
    }
  }

  /* @component meal
     @scope menu
     @summary One meal of a day: its label, then its recipe or the call to choose one.
     @variant free   A meal with no recipe and no dish.
     @variant dish   A meal with a dish that has no recipe.
     @part meal-label  Comida or Cena.
     @part meal-name   The recipe, cut with an ellipsis.
     @example <button class="meal" type="button"><small class="meal-label">Comida</small><span class="meal-name">Tortilla</span></button> */
  .meal {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    min-width: 0;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--accent);
    background: var(--bg);
    text-align: left;
  }

  .meal.free {
    border: 1px dashed var(--muted);
  }

  .meal.dish {
    border-color: var(--muted);
  }

  /* @component meal-actions
     @scope menu
     @summary The buttons of the meal sheet, on a split: Crear receta and Quitar side by side, or
              Quitar alone across the full width.
     @example <div class="split meal-actions" style="width: 100%"><button class="button primary hand-side" type="button">Crear receta</button><button class="button outline danger" type="button">Quitar</button></div> */
  .meal-actions:has(> [hidden]) > :not([hidden]) {
    grid-column: 1 / -1;
  }

  .meal-label {
    color: var(--muted);
    font-size: var(--text-xs);
  }

  .meal-name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meal:not(.free, .dish) .meal-label {
    color: var(--accent);
  }

  .meal.free .meal-name {
    color: var(--muted);
  }

  /* The bar of Menú sticks to the bottom edge of `main`, below its bottom padding (the room that
     the add button takes in the other sections). */
  .item-list ~ .action-bar {
    bottom: calc((var(--tap-l) + var(--space-4) * 2) * -1);
  }

  /* @component products
     @scope recipes
     @summary The products of a recipe in the recipe sheet, each with its remove button.
     @part product       One product.
     @part product-text  Its name.
     @state leaving  On product: a row that closes before it leaves.
     @state flash    On product: a row that has just come: it flashes.
     @example <ul class="products" style="width: 100%"><li class="product"><span class="product-text">Patatas</span><button class="button icon" type="button" aria-label="Quitar">✕</button></li></ul> */
  .products {
    margin: var(--space-2) 0 0;
    padding: 0;
    list-style: none;
  }

  .product {
    display: flex;
    align-items: center;
    min-height: var(--tap);
    border-top: 1px solid var(--line);
  }

  .product-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .products > .leaving {
    overflow: hidden;
    min-height: 0;
    opacity: 0;
    transition: height var(--motion) ease-out, opacity var(--motion) ease-out;
  }

  .product.flash {
    animation: flash var(--motion-slow) ease-out;
  }

  /* @component settings
     @scope settings
     @summary The Ajustes section: groups of settings rows (list-group card) under a list-group-head. A row of Preferencias holds a real select laid over it, so a tap opens the native picker.
     @part settings-hint    A line of help below a group head, on a hint.
     @example <section class="settings" style="width: 100%"><h2 class="list-group-head">Preferencias</h2><div class="list-group card"><div class="settings-row"><span class="settings-row-label">Idioma</span><span class="settings-row-value">Español</span><span class="chevron" aria-hidden="true">›</span><select class="select" aria-label="Idioma"><option>Español</option></select></div></div></section> */
  .settings-hint {
    padding: 0 var(--space-4) var(--space-2);
    text-align: start;
    hyphens: auto;
  }

  /* @extends list-group */
  .settings .settings-row {
    position: relative;
  }

  /* The select is invisible: the row shows the ring when the select has the keyboard focus. */
  .settings .settings-row:has(> .select:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .settings .settings-row > .select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .settings .list-group > .segmented {
    margin: var(--space-2);
  }

  /* @component about
     @scope settings
     @summary The version lines at the end of Ajustes.
     @part about-line  One line: the version and its state.
     @example <footer class="about"><p class="about-line"><span>Versión 1.0.20</span></p></footer> */
  .about {
    margin: var(--space-6) var(--space-3) 0;
    color: var(--muted);
    font-size: var(--text-xs);
    text-align: center;
  }

  .about-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: var(--space-1) var(--space-2);
    margin: 0;
  }

  /* @component onboarding
     @scope onboarding
     @summary The walkthrough of the first start, over the full app: a page, the dots, the buttons.
     @part onboarding-top      The top bar: Atrás at the start and Saltar at the end. It keeps out of the top safe-area inset.
     @part onboarding-logo     The app icon, at the top of the first page only.
     @part onboarding-page     The page in view: on the first page the app icon, then its drawing, its title and its text.
     @part onboarding-title    The title of a page.
     @part onboarding-text     The text of a page.
     @part onboarding-key      A control named in a text, such as + or an icon: its icon and its name in bold accent text, with no box.
     @part onboarding-dots     One dot for each page.
     @part onboarding-dot      One dot.
     @part onboarding-switch   The switch of the sample data on the last page. It keeps its room on each page.
     @state away               On onboarding-switch: a page with no switch. The room stays, so nothing moves.
     @state on                 On onboarding-dot: the page in view.
     @state enter-next         On onboarding-page: it comes in from the right.
     @state enter-previous     On onboarding-page: it comes in from the left.
     @example <div class="onboarding-top" style="width: 100%"><button class="button accent" type="button">Atrás</button><button class="button quiet" type="button">Saltar</button></div>
     @example <div class="onboarding-dots"><span class="onboarding-dot on"></span><span class="onboarding-dot"></span><span class="onboarding-dot"></span></div> */
  .onboarding {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    padding: calc(var(--space-5) + env(safe-area-inset-top)) calc(var(--space-5) + env(safe-area-inset-right))
      calc(var(--space-5) + env(safe-area-inset-bottom)) calc(var(--space-5) + env(safe-area-inset-left));
    background: var(--bg);
    /* A horizontal slide changes the page, so the browser must not take it. */
    touch-action: pan-y;
    overflow: hidden auto;
  }

  /* From 600px the walkthrough keeps the width of the column, centred. */
  @media (min-width: 600px) {
    .onboarding {
      padding-left: max(var(--space-5) + env(safe-area-inset-left), (100% - var(--content-max)) / 2);
      padding-right: max(var(--space-5) + env(safe-area-inset-right), (100% - var(--content-max)) / 2);
    }
  }

  /* A short window, such as a phone on its side, has no room for the logo above the drawing. */
  @media (max-height: 480px) {
    .onboarding-logo {
      display: none;
    }
  }

  /* Atrás sits at the start and Saltar at the end. Saltar keeps its place when Atrás is away. */
  .onboarding-top {
    display: flex;
    flex: none;
    justify-content: space-between;
  }

  .onboarding-top > .button:last-child {
    margin-inline-start: auto;
  }

  .onboarding-logo {
    flex: none;
    width: var(--logo);
    height: var(--logo);
  }

  /* The page group takes the free space between the top bar and the dots, centred. */
  .onboarding-page {
    display: flex;
    flex: none;
    margin-block: auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-6);
    text-align: center;
  }

  .onboarding-page.enter-next,
  .onboarding-page.enter-previous {
    animation: enter var(--motion) ease-out;
  }

  .onboarding-page.enter-next {
    --enter-from: 48px;
  }

  .onboarding-page.enter-previous {
    --enter-from: -48px;
  }

  /* A title can take two lines in some catalogs. It keeps the room of two, with its last line
     next to the text, so the drawing does not move. */
  .onboarding-title {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 2lh;
    margin: 0 0 var(--space-2);
    font-size: var(--text-l);
  }

  /* The longest text of a page, in any catalog, is five lines at 32ch. The text keeps room for
     five, so each page has the same height and the drawing and the logo do not move. */
  .onboarding-text {
    max-width: 32ch;
    /* A line break of a catalog text starts a new line. */
    white-space: pre-line;
    min-height: 5lh;
    margin: 0;
    color: var(--muted);
  }

  .onboarding-switch {
    align-self: stretch;
    border-radius: var(--radius-l);
    background: var(--surface);
  }

  .onboarding-switch.away {
    visibility: hidden;
  }

  .onboarding-key {
    color: var(--accent);
    font-weight: var(--weight-strong);
    white-space: nowrap;
  }

  /* The title takes the focus when the walkthrough opens, so it shows no ring. */
  .onboarding-title:focus {
    outline: none;
  }

  /* The icon of a key sits on the line of the text, with a small gap before its text. */
  .onboarding-key > .icon {
    display: inline-block;
    width: 1em;
    height: 1em;
    margin-right: var(--space-1);
    vertical-align: -0.2em;
  }

  .onboarding-key > .icon:only-child {
    margin-right: 0;
  }

  .onboarding-dots {
    display: flex;
    flex: none;
    justify-content: center;
    gap: var(--space-2);
  }

  .onboarding-dot {
    width: var(--space-2);
    height: var(--space-2);
    border-radius: var(--radius-round);
    background: var(--muted);
  }

  .onboarding-dot.on {
    background: var(--accent);
  }

  .onboarding > .button.wide {
    flex: none;
    min-height: var(--tap-l);
  }

  /* @component onboarding-art
     @scope onboarding
     @summary The line drawing of a walkthrough page, inline in the page. Its shapes take these parts.
     @part art-card     A card shape, filled with --surface.
     @part art-accent   An accent stroke.
     @part art-soft     A soft accent fill.
     @part art-solid    A solid accent fill.
     @part art-on-solid A stroke on a solid fill.
     @example <div class="onboarding-art"><svg viewBox="0 0 240 160" aria-hidden="true"><rect class="art-card art-accent" x="20" y="20" width="90" height="120" rx="10"/><circle class="art-solid" cx="160" cy="80" r="13"/><path class="art-on-solid" d="M160 74v12M154 80h12"/></svg></div> */
  .onboarding-art > svg {
    display: block;
    width: min(var(--art-width), 70vw);
    height: auto;
    fill: none;
    stroke: var(--muted);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .art-card {
    fill: var(--surface);
  }

  .art-accent {
    stroke: var(--accent);
  }

  .art-soft {
    fill: var(--accent-soft);
    stroke: var(--accent);
  }

  .art-solid {
    fill: var(--accent);
    stroke: none;
  }

  .art-on-solid {
    stroke: var(--accent-text);
  }
}

</style>
<style>
/* Direction "Taller" (visual): a flat, high-contrast utility look.
   Loads after design-system.css. Tokens only: the names of DS-2 keep, the values change.
   Try: http://localhost:8090/?css=docs/design-alternatives/themes/theme-utility.css */
@layer tokens, base, components, layouts, screens;

@layer tokens {
  :root {
    --bg: light-dark(#fafbfa, #0f1210);
    --surface: light-dark(#ffffff, #171b18);
    --surface-2: light-dark(#eef1ee, #232825);
    --text: light-dark(#101411, #f3f5f3);
    --muted: light-dark(#4c5650, #a9b2ac);
    --line: light-dark(#c6cec9, #3b423e);
    --accent: light-dark(#0f6b3f, #6fd39c);
    --accent-text: light-dark(#ffffff, #06150c);
    --accent-soft: light-dark(#d8eee1, #173a27);
    --danger: light-dark(#a3221a, #ffb4ab);
    --warning: light-dark(#7a4a00, #f5c267);
    --toast-bg: light-dark(#101411, #f3f5f3);
    --toast-text: light-dark(#ffffff, #101411);

    --text-l: 1.25rem;
    --text-xl: 1.75rem;
    --weight-medium: 500;

    --radius-s: 2px;
    --radius-m: 6px;
    --radius-l: 8px;
    --radius-xl: 12px;

    --tap-l: 52px;
    --nav-height: 60px;
    --dock-height: 52px;

    /* A hairline ring stands in for every shadow: the look is flat. */
    --shadow-s: 0 0 0 1px rgb(16 20 17 / 0.14);
    --shadow-l: 0 0 0 1px rgb(16 20 17 / 0.14), 0 2px 6px rgb(16 20 17 / 0.16);

    --motion-fast: 100ms;
    --motion: 160ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
}

</style>
<style>
/* Helpers of the mockups only: nothing here is a proposal. */
@layer screens {
  /* The app icon of the walkthrough, drawn from the sprite instead of icons/logo.png. */
  .logo-box {
    display: grid;
    place-items: center;
    border-radius: var(--radius-l);
    background: var(--accent);
    color: var(--accent-text);
  }

  .logo-box > .icon {
    width: 60%;
    height: 60%;
  }

  /* A frame is static: no transition plays on load. */
  .sheet-layer,
  .sheet,
  .sheet-veil {
    transition: none;
  }
}

</style>
</head>
